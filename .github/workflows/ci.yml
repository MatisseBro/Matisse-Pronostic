name: CI — MatiMatch

on:
  push:
    branches: [main, securite-seance12, dev]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test + build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # Crée un fichier .env factice pour que dotenv ne lève pas d'erreur.
      # Les vraies valeurs ne sont jamais stockées dans les secrets CI pour ce projet.
      - name: Créer .env de test
        run: |
          cat > .env << 'EOF'
          API_FOOTBALL_KEY=ci_test_key
          MQTT_HOST=mqtt.example.com
          MQTT_PORT=8883
          MQTT_USER=ci_user
          MQTT_PASSWORD=ci_password
          ADMIN_EMAIL=admin@example.com
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter=expanded

      - name: flutter build apk (debug)
        run: flutter build apk --debug

      - name: Vérifier absence de .env dans l'APK
        run: |
          set +e
          unzip -p build/app/outputs/flutter-apk/app-debug.apk \
            assets/flutter_assets/.env > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "::warning::.env trouvé dans l'APK — retirer l'asset de pubspec.yaml"
          else
            echo ".env absent de l'APK ✓"
          fi

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
