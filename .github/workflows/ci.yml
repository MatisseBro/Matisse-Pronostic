name: MatiMatch - Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Create non-secret CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_FOOTBALL_KEY=ci-placeholder
          MQTT_HOST=localhost
          MQTT_PORT=8883
          MQTT_USER=ci-placeholder
          MQTT_PASSWORD=ci-placeholder
          ADMIN_EMAIL=ci@example.invalid
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Create non-secret CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_FOOTBALL_KEY=ci-placeholder
          MQTT_HOST=localhost
          MQTT_PORT=8883
          MQTT_USER=ci-placeholder
          MQTT_PASSWORD=ci-placeholder
          ADMIN_EMAIL=ci@example.invalid
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

  android-build:
    name: Android debug build
    needs: [analyze, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Java version
        run: java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      # The app declares .env as a Flutter asset. CI uses placeholders only;
      # no production secret is read from GitHub Actions.
      - name: Create non-secret CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_FOOTBALL_KEY=ci-placeholder
          MQTT_HOST=localhost
          MQTT_PORT=8883
          MQTT_USER=ci-placeholder
          MQTT_PASSWORD=ci-placeholder
          ADMIN_EMAIL=ci@example.invalid
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Android debug build
        run: flutter build apk --debug --no-pub
