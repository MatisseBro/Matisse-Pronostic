name: CI - MatiMatch

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter checks and Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      # The app declares .env as a Flutter asset. CI therefore needs the file,
      # but only non-sensitive placeholders are used and no production secret
      # is read from GitHub Actions.
      - name: Create non-secret CI environment file
        shell: bash
        run: |
          cat > .env <<'EOF'
          API_FOOTBALL_KEY=ci-placeholder
          MQTT_HOST=localhost
          MQTT_PORT=8883
          MQTT_USER=ci-placeholder
          MQTT_PASSWORD=ci-placeholder
          ADMIN_EMAIL=ci@example.invalid
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # A debug APK uses the Android debug signing key generated on the runner;
      # it does not require a production keystore or signing secret.
      - name: Verify Android debug build
        run: flutter build apk --debug --no-pub
